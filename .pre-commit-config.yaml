# Same local R hooks as AutoCDAScorer. styler formats the files being committed;
# lintr fails the commit on any lint.
exclude: ^man/

repos:
  - repo: local
    hooks:
      - id: style-files
        name: style-files (styler)
        entry: Rscript .pre-commit-hooks/style_files.R
        language: system
        files: '\.([rR]|[rR]md)$'
      - id: lintr
        name: lintr
        entry: Rscript .pre-commit-hooks/lint_check.R
        language: system
        files: '\.([rR]|[rR]md)$'
